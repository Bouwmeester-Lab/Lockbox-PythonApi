[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockbox"
version = "0.1.0"
description = "Python client for the Lockbox REST API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "signalrcore==1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
